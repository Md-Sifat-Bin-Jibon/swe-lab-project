[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    smoke: fast critical-path checks
    public: public browser checks
    auth: authentication checks
    app: authenticated application checks
    admin: administrator checks
    workflow: multi-step business workflows
    security: browser-level authorization/security checks
    comprehensive: broad route/component checks
